name: ci

on:
  push:
    branches:
      - main
  pull_request:

env:
  PROTON_NO_UPDATE_CHECK: 1
  PROTON_RUNTIME_STORE: ${{ github.workspace }}/.proton-runtime-store

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s nightly
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: moon version
        run: moon version --all

      - name: Format check
        run: moon fmt --check

  moonbit:
    needs: format
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
      fail-fast: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    continue-on-error: false
    steps:
      - uses: actions/checkout@v6

      - name: Cache MoonBit packages
        uses: actions/cache@v6
        with:
          path: .mooncakes
          key: ${{ runner.os }}-mooncakes-${{ hashFiles('**/moon.mod') }}
          restore-keys: ${{ runner.os }}-mooncakes-

      - name: Cache Proton runtimes
        uses: actions/cache@v6
        with:
          path: .proton-runtime-store
          key: ${{ runner.os }}-proton-runtime-${{ hashFiles('cefsetup/requirements.json') }}

      - name: Install MoonBit
        if: ${{ matrix.os != 'windows-latest' }}
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s nightly
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Install MoonBit on Windows
        if: ${{ matrix.os == 'windows-latest' }}
        env:
          MOONBIT_INSTALL_VERSION: nightly
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser; irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "$env:USERPROFILE\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Install Linux native dependencies
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev xvfb openbox libnotify-dev

      - name: moon version
        run: |
          moon version --all

      - name: moon update
        run: |
          moon update

      - name: Setup MSVC
        if: ${{ matrix.os == 'windows-latest' }}
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Test bridge bootstrap JS
        run: node --test proton/internal/native/ffi/tests/bridge_bootstrap.test.mjs

      - name: Configure CEF runtime and build helper on Unix
        if: ${{ matrix.os != 'windows-latest' }}
        run: |
          runtime=$(PROTON_CEF_SETUP_BOOTSTRAP=1 moon -C cefsetup run . --target native | tail -n 1)
          helper_bin="$RUNNER_TEMP/proton-helper"
          moon --target-dir "$RUNNER_TEMP/proton-helper-build" install \
            --path proton/internal/cef_process --bin "$helper_bin"
          helper="$helper_bin/cef_process"
          echo "PROTON_RUNTIME_ROOT=$runtime" >> "$GITHUB_ENV"
          echo "PROTON_HELPER_PATH=$helper" >> "$GITHUB_ENV"

      - name: Configure CEF runtime and build helper on Windows
        if: ${{ matrix.os == 'windows-latest' }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $env:PROTON_CEF_SETUP_BOOTSTRAP = "1"
          $runtime = moon -C cefsetup run . --target native | Select-Object -Last 1
          Remove-Item Env:PROTON_CEF_SETUP_BOOTSTRAP
          $helperBin = Join-Path $env:RUNNER_TEMP "proton-helper"
          $helperBuild = Join-Path $env:RUNNER_TEMP "proton-helper-build"
          moon --target-dir $helperBuild install --path proton/internal/cef_process --bin $helperBin
          # windows-latest runners have no usable D3D device; force ANGLE's
          # SwiftShader path so the engine's GPU process can start at all.
          $env:ANGLE_DEFAULT_PLATFORM = "swiftshader"
          "ANGLE_DEFAULT_PLATFORM=swiftshader" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PROTON_RUNTIME_ROOT=$runtime" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PROTON_HELPER_PATH=$(Join-Path $helperBin 'cef_process.exe')" | Out-File -FilePath $env:GITHUB_ENV -Append
          Join-Path $runtime "bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Verify generated files
        run: node scripts/verify_generated.mjs

      - name: Check framework modules
        if: ${{ matrix.os != 'windows-latest' }}
        run: |
          moon check --target native --deny-warn
          moon -C package test lib --target native --diagnostic-limit 80
          moon -C codegen test lib --target wasm --diagnostic-limit 80
          moon -C cdp test -p moonbit-community/proton_cdp/client --target native --diagnostic-limit 80
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            xvfb-run -a moon -C proton test internal/native --target native --diagnostic-limit 80
            xvfb-run -a moon -C proton test updater --target native --diagnostic-limit 80
            xvfb-run -a moon -C cli test -p moonbit-community/proton_cli \
              moonbit-community/proton_cli/arguments moonbit-community/proton_cli/build_cmd \
              moonbit-community/proton_cli/cef \
              moonbit-community/proton_cli/dev moonbit-community/proton_cli/doctor \
              moonbit-community/proton_cli/fsutil moonbit-community/proton_cli/new \
              moonbit-community/proton_cli/output moonbit-community/proton_cli/package \
              --target native --no-parallelize --diagnostic-limit 80
          else
            moon -C proton test internal/native --target native --diagnostic-limit 80
            moon -C proton test updater --target native --diagnostic-limit 80
            moon -C cli test -p moonbit-community/proton_cli \
              moonbit-community/proton_cli/arguments moonbit-community/proton_cli/build_cmd \
              moonbit-community/proton_cli/cef \
              moonbit-community/proton_cli/dev moonbit-community/proton_cli/doctor \
              moonbit-community/proton_cli/fsutil moonbit-community/proton_cli/new \
              moonbit-community/proton_cli/output moonbit-community/proton_cli/package \
              --target native --no-parallelize --diagnostic-limit 80
          fi
          moon -C e2e build --target native --diagnostic-limit 80

      - name: Check framework modules on Windows
        if: ${{ matrix.os == 'windows-latest' }}
        env:
          _CL_: /utf-8
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          moon check --target native --deny-warn
          moon -C package test lib --target native --diagnostic-limit 80
          moon -C codegen test lib --target wasm --diagnostic-limit 80
          moon -C cdp test -p moonbit-community/proton_cdp/client --target native --diagnostic-limit 80
          moon -C proton test internal/native --target native --diagnostic-limit 80
          moon -C proton test updater --target native --diagnostic-limit 80
          moon -C cli test -p moonbit-community/proton_cli moonbit-community/proton_cli/arguments moonbit-community/proton_cli/build_cmd moonbit-community/proton_cli/cef moonbit-community/proton_cli/dev moonbit-community/proton_cli/doctor moonbit-community/proton_cli/fsutil moonbit-community/proton_cli/new moonbit-community/proton_cli/output moonbit-community/proton_cli/package --target native --no-parallelize --diagnostic-limit 80
          moon -C e2e build --target native --diagnostic-limit 80

      - name: Test extensions on Unix
        if: ${{ matrix.os != 'windows-latest' }}
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            xvfb-run -a moon -C extensions test -p moonbit-community/proton_ext \
              moonbit-community/proton_ext/auto_launch moonbit-community/proton_ext/clipboard \
              moonbit-community/proton_ext/dialog moonbit-community/proton_ext/fs \
              moonbit-community/proton_ext/global_hotkey moonbit-community/proton_ext/keepawake \
              moonbit-community/proton_ext/microphone \
              moonbit-community/proton_ext/notification moonbit-community/proton_ext/path \
              moonbit-community/proton_ext/shell moonbit-community/proton_ext/tray \
              --target native
            xvfb-run -a moon test -p moonbit-community/proton_auto_launch moonbit-community/proton_clipboard \
              moonbit-community/proton_global_hotkey moonbit-community/proton_keepawake moonbit-community/proton_microphone \
              moonbit-community/proton_tray --target native
          else
            moon -C extensions test -p moonbit-community/proton_ext \
              moonbit-community/proton_ext/auto_launch moonbit-community/proton_ext/clipboard \
              moonbit-community/proton_ext/dialog moonbit-community/proton_ext/fs \
              moonbit-community/proton_ext/global_hotkey moonbit-community/proton_ext/keepawake \
              moonbit-community/proton_ext/microphone \
              moonbit-community/proton_ext/notification moonbit-community/proton_ext/path \
              moonbit-community/proton_ext/shell moonbit-community/proton_ext/tray \
              --target native
            moon test -p moonbit-community/proton_auto_launch moonbit-community/proton_clipboard \
              moonbit-community/proton_global_hotkey moonbit-community/proton_keepawake moonbit-community/proton_microphone \
              moonbit-community/proton_tray --target native
          fi

      - name: Test extensions on Windows
        if: ${{ matrix.os == 'windows-latest' }}
        env:
          _CL_: /utf-8
          PATH: ${{ github.workspace }}\lib;${{ env.PATH }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $extensionPackages = @(
            "moonbit-community/proton_ext"
            "moonbit-community/proton_ext/auto_launch"
            "moonbit-community/proton_ext/clipboard"
            "moonbit-community/proton_ext/dialog"
            "moonbit-community/proton_ext/fs"
            "moonbit-community/proton_ext/global_hotkey"
            "moonbit-community/proton_ext/keepawake"
            "moonbit-community/proton_ext/microphone"
            "moonbit-community/proton_ext/notification"
            "moonbit-community/proton_ext/path"
            "moonbit-community/proton_ext/shell"
            "moonbit-community/proton_ext/tray"
          )
          moon -C extensions test -p $extensionPackages --target native
          $sysPackages = @(
            "moonbit-community/proton_auto_launch"
            "moonbit-community/proton_clipboard"
            "moonbit-community/proton_global_hotkey"
            "moonbit-community/proton_keepawake"
            "moonbit-community/proton_microphone"
            "moonbit-community/proton_tray"
          )
          moon test -p $sysPackages --target native

      - name: Build examples
        if: ${{ matrix.os != 'windows-latest' }}
        run: |
          moon -C examples build --target native

      - name: Build examples on Windows
        if: ${{ matrix.os == 'windows-latest' }}
        env:
          _CL_: /utf-8
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          moon -C examples build --target native

      - name: List Windows example binaries
        if: ${{ matrix.os == 'windows-latest' }}
        run: Get-ChildItem -Path ".\_build" -Recurse -Filter "*.exe" | ForEach-Object { "{0} ({1} bytes)" -f $_.FullName, $_.Length }

      - name: Run MoonBit CDP e2e on Windows
        if: ${{ matrix.os == 'windows-latest' }}
        timeout-minutes: 25
        env:
          _CL_: /utf-8
          PROTON_BRIDGE_E2E_TIMEOUT_MS: 60000
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          moon -C e2e run test --target native --diagnostic-limit 200 -- --self-hosted

      - name: Run MoonBit CDP e2e on Unix
        if: ${{ matrix.os != 'windows-latest' }}
        timeout-minutes: 25
        env:
          PROTON_BRIDGE_E2E_TIMEOUT_MS: 60000
          MOON_CC: clang
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            xvfb-run -a moon -C e2e run test --target native \
              --diagnostic-limit 200 -- --self-hosted
          else
            moon -C e2e run test --target native \
              --diagnostic-limit 200 -- --self-hosted
          fi

      - name: List Unix example binaries
        if: ${{ matrix.os != 'windows-latest' }}
        run: find ./_build -type f -perm -111 | xargs ls -lh
