name: publish-packages

run-name: publish Proton packages to Mooncakes

on:
  workflow_dispatch:
    inputs:
      resume_from:
        description: First module to publish after a partial release
        type: choice
        default: config
        options:
          - config
          - codegen
          - contract
          - rsa
          - updater
          - cefsetup
          - package
          - sys/ffi
          - sys/shell
          - sys/auto_launch
          - sys/clipboard
          - sys/global_hotkey
          - sys/keepawake
          - sys/microphone
          - sys/power_monitor
          - sys/screen_monitor
          - sys/tray
          - client
          - rabbita
          - proton
          - extensions
          - cli

permissions:
  contents: read

concurrency:
  group: publish-mooncakes
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Require main branch
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Packages may only be published from main." >&2
            exit 1
          fi

      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev xvfb openbox libnotify-dev

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s nightly
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Show MoonBit version
        run: moon version --all

      - name: Update MoonBit registry
        run: moon update

      - name: Install CEF runtime and build helper from source
        run: |
          PROTON_CEF_SETUP_BOOTSTRAP=1 moon -C cefsetup run . --target native -- --runtime-only
          helper_bin="$RUNNER_TEMP/proton-helper"
          moon --target-dir "$RUNNER_TEMP/proton-helper-build" install --path \
            proton/internal/cef_process --bin "$helper_bin"

      - name: Validate release
        run: |
          moon fmt --check
          node scripts/verify_generated.mjs
          node scripts/verify_release_metadata.mjs
          moon check --target native

      - name: Configure Mooncakes credentials
        env:
          MOONCAKES_CREDENTIALS: ${{ secrets.MOONCAKES_MOONBIT_COMMUNITY_TOKEN }}
        run: |
          mkdir -p "$HOME/.moon"
          printf '%s' "$MOONCAKES_CREDENTIALS" > "$HOME/.moon/credentials.json"

      - name: Publish packages
        run: |
          resume_from="${{ inputs.resume_from }}"
          publishing=false

          publish_module() {
            module_dir="$1"
            module_name="$2"
            if [ "$publishing" != "true" ]; then
              if [ "$module_dir" != "$resume_from" ]; then
                echo "Skipping $module_name before resume point $resume_from"
                return
              fi
              publishing=true
            fi
            echo "Publishing $module_name from $module_dir"
            moon -C "$module_dir" publish
            moon update
          }

          publish_module config moonbit-community/proton_config
          publish_module codegen moonbit-community/proton_codegen
          publish_module contract moonbit-community/proton_contract
          publish_module rsa moonbit-community/proton_rsa
          publish_module updater moonbit-community/proton_updater
          publish_module cefsetup moonbit-community/proton_cefsetup
          publish_module package moonbit-community/proton_package

          publish_module sys/ffi moonbit-community/proton_ffi
          publish_module sys/shell moonbit-community/proton_shell
          publish_module sys/auto_launch moonbit-community/proton_auto_launch
          publish_module sys/clipboard moonbit-community/proton_clipboard
          publish_module sys/global_hotkey moonbit-community/proton_global_hotkey
          publish_module sys/keepawake moonbit-community/proton_keepawake
          publish_module sys/microphone moonbit-community/proton_microphone
          publish_module sys/power_monitor moonbit-community/proton_power_monitor
          publish_module sys/screen_monitor moonbit-community/proton_screen_monitor
          publish_module sys/tray moonbit-community/proton_tray

          publish_module client moonbit-community/proton_client
          publish_module rabbita moonbit-community/proton_rabbita
          publish_module proton moonbit-community/proton
          publish_module extensions moonbit-community/proton_ext
          publish_module cli moonbit-community/proton_cli

      - name: Remove Mooncakes credentials
        if: always()
        run: rm -f "$HOME/.moon/credentials.json"
