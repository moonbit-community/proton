name: documentation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: python3 ../scripts/check_book.py
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.4.52
      - run: mdbook build
      - run: mdbook build zh
      - run: python3 ../scripts/check_book.py --html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  tutorials:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libx11-dev libxrandr-dev libgtk-3-dev libwebkit2gtk-4.1-dev libnotify-dev
      - name: Install stable MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s latest
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Install the CLI from this checkout
        run: |
          moon update
          moon install --path cli
          proton_cli cef setup
      - name: Compile documented tutorials and validate configuration and CLI reference
        run: python3 scripts/check_book.py --cli "$HOME/.moon/bin/proton_cli" --tutorials --source

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [build, tutorials]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
