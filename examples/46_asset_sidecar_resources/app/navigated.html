<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Asset Navigation Complete</title>
  </head>
  <body>
    <main>
      <h1 id="navigation-result">Waiting for bridge.</h1>
      <script>
        window.addEventListener("load", async () => {
          const total = await window.__MoonBit__.add.add({
            left: 20,
            right: 22,
          });
          document.querySelector("#navigation-result").textContent =
            `Navigated with bridge: ${total}`;
        });
      </script>
    </main>
  </body>
</html>
