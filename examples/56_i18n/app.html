<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Proton 国际化</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 36px; background: Canvas; color: CanvasText; }
      main { max-width: 760px; margin: 0 auto; }
      h1 { margin: 0 0 8px; font-size: 30px; }
      p { color: GrayText; line-height: 1.55; }
      dl { display: grid; grid-template-columns: 210px 1fr; gap: 12px 20px; margin-top: 28px; }
      dt { font-weight: 650; }
      dd { margin: 0; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; overflow-wrap: anywhere; }
      .status { margin-top: 28px; padding-top: 18px; border-top: 1px solid GrayText; }
    </style>
  </head>
  <body>
    <main>
      <h1>Proton 国际化契约</h1>
      <p>
        Proton 负责选择并传递应用 locale；此页面的中文文案由应用自身提供。
      </p>
      <dl>
        <dt>MoonBit locale</dt>
        <dd id="backend-locale">正在读取...</dd>
        <dt>MoonBit preferences</dt>
        <dd id="backend-languages">正在读取...</dd>
        <dt>navigator.language</dt>
        <dd id="navigator-language"></dd>
        <dt>navigator.languages</dt>
        <dd id="navigator-languages"></dd>
      </dl>
      <p class="status" id="status">正在连接 Proton bridge...</p>
    </main>
    <script>
      document.getElementById("navigator-language").textContent = navigator.language;
      document.getElementById("navigator-languages").textContent =
        JSON.stringify(navigator.languages);

      window.__MoonBit__.i18n.current({}).then((snapshot) => {
        document.getElementById("backend-locale").textContent = snapshot.locale;
        document.getElementById("backend-languages").textContent =
          JSON.stringify(snapshot.preferred_languages);
        document.getElementById("status").textContent =
          "后端、CEF 与原生菜单共享同一个启动期 locale。";
      }).catch((error) => {
        document.getElementById("status").textContent = String(error);
      });
    </script>
  </body>
</html>
